<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Tracker</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-icon-192.png">
<link rel="apple-touch-icon" href="icon-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assets">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><h1 id="title">Scan</h1><div class="hdr-r"><span id="net" class="net" hidden>Offline</span><button id="btn-refresh" class="iconbtn" aria-label="Refresh data" title="Refresh data"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button></div></header>

<main>
  <!-- SCAN -->
  <section id="view-scan" class="view">
    <div class="scanbox">
      <video id="video" playsinline muted></video>
      <div class="frame"><i></i><i></i><i></i><i></i></div>
      <div id="scanmsg" class="scanmsg">Camera is off</div>
    </div>
    <div class="row">
      <button id="btn-cam" class="btn primary">Start scanning</button>
      <label class="btn">Scan from photo<input id="file-qr" type="file" accept="image/*" hidden></label>
    </div>
    <form id="manual" class="manual">
      <input id="manual-id" inputmode="numeric" placeholder="Or type an asset number" autocomplete="off">
      <button class="btn">Find</button>
    </form>
    <div id="result"></div>
  </section>

  <!-- ASSETS -->
  <section id="view-assets" class="view" hidden>
    <input id="q" type="search" class="search" placeholder="Search name, owner, number…">
    <div id="chips" class="chips"></div>
    <div id="list" class="list"></div>
  </section>

  <!-- DASHBOARD -->
  <section id="view-dash" class="view" hidden></section>
</main>

<div id="install" class="install" hidden><span id="install-text">Install this app on your phone</span><button id="install-btn" class="btn primary">Install</button><button id="install-x" class="close2" aria-label="Dismiss">×</button></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-body"><button id="sheet-close" class="close" aria-label="Close">×</button><div id="sheet-content"></div></div>
</div>

<nav class="tabs">
  <button data-tab="scan" class="on"><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4M4 12h16"/></svg>Scan</button>
  <button data-tab="assets"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Assets</button>
  <button data-tab="dash"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Dashboard</button>
</nav>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
